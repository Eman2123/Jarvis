name: Build Jarvis.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<70"
          pip install -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm Jarvis.spec

      - name: Zip
        run: Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows
          path: Jarvis-windows.zip
