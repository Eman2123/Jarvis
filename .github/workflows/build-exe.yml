name: Build Jarvis.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<70"
          pip install -r requirements-build.txt

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --log-level WARN Jarvis.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 30) -join "%0A"
            Write-Host "::error title=PyInstaller failed::$tail"
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Zip
        run: Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows
          path: Jarvis-windows.zip
