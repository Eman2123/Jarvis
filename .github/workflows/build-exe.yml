name: Build Jarvis.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<70"
          pip install -r requirements-build.txt

      - name: Build
        shell: bash
        run: |
          set +e
          pyinstaller --noconfirm Jarvis.spec > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -n 40 build.log | sed 's/%/%25/g' | tr '\n' '|' > tail.txt
            echo "::error title=PyInstaller failed::$(cat tail.txt)"
          fi
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Zip
        run: Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows
          path: Jarvis-windows.zip
