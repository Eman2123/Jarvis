name: Build Jarvis.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<70"
          pip install -r requirements-build.txt
          pip uninstall -y enum34

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --log-level WARN Jarvis.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 30) -join "%0A"
            Write-Host "::error title=PyInstaller failed::$tail"
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Zip
        run: Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows
          path: Jarvis-windows.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            gh release create $tag Jarvis-windows.zip --title "Jarvis $tag" --notes "Windows build of Jarvis. Download Jarvis-windows.zip, extract it, and run Jarvis\Jarvis.exe."
          } else {
            $tag = "build-$env:GITHUB_RUN_NUMBER"
            gh release create $tag Jarvis-windows.zip --target $env:GITHUB_SHA --title "Jarvis build $env:GITHUB_RUN_NUMBER" --notes "Windows build of Jarvis. Download Jarvis-windows.zip, extract it, and run Jarvis\Jarvis.exe."
          }
